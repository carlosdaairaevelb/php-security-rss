name: Update PHP Security RSS

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate RSS
        env:
          # Sin token, la API de GitHub limita a 60 peticiones/hora por IP
          # (compartida entre runners) y la llamada falla con 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_rss.py

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload RSS
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  # El despliegue va en un job aparte (patrón oficial de GitHub Pages):
  # así el artefacto ya está registrado cuando deploy-pages lo busca.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
